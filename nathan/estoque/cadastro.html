<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="cadastro.css">

</head>

<body>

    <div class="container">

        <h1>📦 Cadastro de Produtos</h1>

        <form id="formProduto">

            <div class="campo">

                <label for="nome">Nome do Produto</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do produto"
                    required>

            </div>

            <div class="campo">

                <label for="preco">Preço (R$)</label>

                <input
                    type="number"
                    id="preco"
                    placeholder="0,00"
                    min="0.01"
                    step="0.01"
                    required>

            </div>

            <div class="campo">

                <label for="quantidade">Quantidade</label>

                <input
                    type="number"
                    id="quantidade"
                    placeholder="0"
                    min="1"
                    required>

            </div>

            <div class="botoes">

                <button type="submit">
                    Cadastrar Produto
                </button>

                <button type="reset">
                    Limpar
                </button>

            </div>

        </form>

        <hr>

        <a href="estoque.html" class="link">
            Ver Estoque
        </a>

    </div>

    <script src="cadastro.js"></script>

</body>

</html>
