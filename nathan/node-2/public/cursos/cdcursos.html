<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Curso</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Cadastrar Curso</h1>

        <form id="formCurso">

            <label>Nome</label>

            <input
                type="text"
                id="nome"
                required
            >

            <label>Carga Horária</label>

            <input
                type="number"
                id="carga_horaria"
                required
            >

            <label>Valor</label>

            <input
                type="number"
                id="valor"
                step="0.01"
                required
            >

            <button type="submit">
                Salvar Curso
            </button>

        </form>

        <p id="mensagem"></p>

        <a href="home.html">
            Voltar
        </a>

    </div>

    <script src="cdcursos.js"></script>

</body>
</html>
