<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Biblioteca Digital</title>

    <link rel="stylesheet" href="/style/css.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-icon">
            📝
        </div>

        <h1>Criar conta</h1>

        <p class="auth-subtitle">
            Cadastre-se para acessar o sistema
        </p>


        <form id="formCadastro">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >


            <button type="submit" class="auth-button">
                Criar conta
            </button>

        </form>


        <p id="mensagem"></p>


        <div class="auth-divider">
            <span>ou</span>
        </div>


        <p class="auth-register">
            Já possui uma conta?
        </p>

        <a href="/login/login.html" class="register-button">
            Voltar para Login
        </a>

    </div>


    <script src="/cadastro/cadastro.js"></script>

</body>

</html>
