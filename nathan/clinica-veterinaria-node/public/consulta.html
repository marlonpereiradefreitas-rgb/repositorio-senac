<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Consulta - Clínica</title>
    <link rel="stylesheet" href="css/visual.css">
</head>
<body>

<header>
    <h1>Clínica Veterinária</h1>

    <nav>
        <a href="home.html">Início</a>
        <a href="animais.html">Animais</a>
        <a href="consultas.html">Consultas</a>
        <a href="veterinarios.html">Veterinários</a>
    </nav>
</header>

<main>

    <div class="card">

        <h2>Nova Consulta</h2>

        <form id="formConsulta">

            <label for="animal_id">
                Animal
            </label>

            <select id="animal_id" required>
                <option value="">
                    Selecione o animal
                </option>
            </select>

            <label for="veterinario_id">
                Veterinário
            </label>

            <select id="veterinario_id" required>
                <option value="">
                    Selecione o veterinário
                </option>
            </select>

            <label for="data">
                Data
            </label>

            <input
                type="date"
                id="data"
                required
            >

            <label for="hora">
                Hora
            </label>

            <input
                type="time"
                id="hora"
                required
            >

            <label for="motivo">
                Motivo da consulta
            </label>

            <textarea
                id="motivo"
                rows="4"
                placeholder="Descreva o motivo da consulta"
                required
            ></textarea>

            <button type="submit">
                Cadastrar Consulta
            </button>

        </form>

        <p id="mensagem"></p>

    </div>

</main>

<script src="js/nova-consulta.js"></script>

</body>
</html>
