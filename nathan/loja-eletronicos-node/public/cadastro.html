<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="css/visual.css">
</head>

<body>

    <header>

        <h1>Cadastro de Usuário</h1>

    </header>

    <main>

        <div class="card">

            <h2>Cadastrar Usuário</h2>

            <form id="formUsuario">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagem"></p>

            <a href="login.html">
                Voltar para o login
            </a>

        </div>

    </main>

    <script src="js/novo-usuario.js"></script>

</body>

</html>
