<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
        href="css/visual.css">

</head>

<body>

    <header>

        <h1>Loja de Eletrônicos</h1>

    </header>

    <main>

        <div class="card">

            <h2>Login</h2>

            <form id="formLogin">

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu email"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="mensagem"></p>

            <p>
                Não possui uma conta?
                <a href="cadastro.html">
                    Cadastre-se
                </a>
            </p>

        </div>

    </main>

    <script src="js/entrar.js"></script>

</body>

</html>
