<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Novo Produto</title>

    <link rel="stylesheet" href="css/visual.css">
</head>

<body>

    <header>

        <h1>Novo Produto</h1>

    </header>

    <main>

        <div class="card">

            <form id="formProduto">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do produto"
                    required
                >

                <input
                    type="number"
                    step="0.01"
                    id="preco"
                    placeholder="Preço"
                    required
                >

                <input
                    type="number"
                    id="estoque"
                    placeholder="Estoque"
                    required
                >

                <input
                    type="number"
                    id="categoria_id"
                    placeholder="ID da categoria"
                    required
                >

                <button type="submit">
                    Cadastrar Produto
                </button>

            </form>

            <p id="mensagem"></p>

            <a href="produtos.html">
                Voltar
            </a>

        </div>

    </main>

    <script src="js/novo-produto.js"></script>

</body>

</html>
