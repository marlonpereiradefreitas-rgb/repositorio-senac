<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Novo Funcionário</title>

    <link rel="stylesheet" href="css/visual.css">
</head>

<body>

    <header>

        <h1>Novo Funcionário</h1>

    </header>

    <main>

        <div class="card">

            <form id="formFuncionario">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="cargo"
                    placeholder="Cargo"
                    required
                >

                <button type="submit">
                    Cadastrar Funcionário
                </button>

            </form>

            <p id="mensagem"></p>

            <a href="funcionarios.html">
                Voltar
            </a>

        </div>

    </main>

    <script src="js/novo-funcionario.js"></script>

</body>

</html>
