<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nova Categoria</title>

    <link rel="stylesheet" href="css/visual.css">
</head>

<body>

    <header>

        <h1>Nova Categoria</h1>

    </header>

    <main>

        <div class="card">

            <form id="formCategoria">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome da categoria"
                    required
                >

                <button type="submit">
                    Cadastrar Categoria
                </button>

            </form>

            <p id="mensagem"></p>

            <a href="categorias.html">
                Voltar
            </a>

        </div>

    </main>

    <script src="js/nova-categoria.js"></script>

</body>

</html>
